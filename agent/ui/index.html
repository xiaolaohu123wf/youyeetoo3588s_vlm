<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>语音助手</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --warn: #ffb020;
      --text: #e7ecf3;
      --muted: #8b9cb3;
    }
    * { box-sizing: border-box; }
    html {
      font-size: 24px;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Cantarell", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      padding: 0.65rem 1.1rem;
      background: linear-gradient(135deg, #1e3a5f, #0f1419);
      border-bottom: 1px solid #243044;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
    .exit-btn {
      flex: 0 0 auto;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.95rem;
      border-radius: 10px;
      border: 1px solid #4a6078;
      background: #243044;
      color: var(--text);
      cursor: pointer;
      line-height: 1.2;
    }
    .exit-btn:hover { background: #2d3f56; }
    .exit-btn:active { background: #1a2838; }
    .settings-btn {
      flex: 0 0 auto;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.95rem;
      border-radius: 10px;
      border: 1px solid #3d8bfd66;
      background: #1e3a5f;
      color: var(--text);
      cursor: pointer;
      line-height: 1.2;
    }
    .settings-btn:hover { background: #254a75; }
    .debug-btn {
      flex: 0 0 auto;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.95rem;
      border-radius: 10px;
      border: 1px solid #3dd68c66;
      background: #1a3328;
      color: var(--text);
      cursor: pointer;
      line-height: 1.2;
    }
    .debug-btn:hover { background: #214032; }
    .modal.debug-modal {
      width: min(100%, 920px);
    }
    .debug-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }
    .debug-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .debug-badge {
      font-size: 0.68rem;
      padding: 0.18rem 0.45rem;
      border-radius: 999px;
      border: 1px solid #243044;
      background: #0f1419;
      color: var(--muted);
    }
    .debug-badge.ok { color: var(--ok); border-color: #3dd68c55; }
    .debug-badge.bad { color: #ff7b72; border-color: #ff7b7255; }
    .debug-pre {
      margin: 0;
      padding: 0.75rem 0.85rem;
      background: #0b1016;
      border: 1px solid #243044;
      border-radius: 12px;
      font-family: "DejaVu Sans Mono", "Consolas", monospace;
      font-size: 0.62rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 62vh;
      overflow: auto;
      color: #d7dee8;
    }
    .debug-status {
      min-height: 1rem;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .debug-audio-panel {
      margin-bottom: 0.75rem;
      padding: 0.75rem 0.85rem;
      border: 1px solid #243044;
      border-radius: 12px;
      background: #121820;
    }
    .debug-audio-panel h3 {
      margin: 0 0 0.55rem;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .debug-audio-note {
      margin: 0 0 0.65rem;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .debug-audio-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.45rem;
    }
    .debug-audio-row label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .debug-audio-row input[type="number"] {
      width: 3.2rem;
      font: inherit;
      font-size: 0.82rem;
      padding: 0.25rem 0.35rem;
      border-radius: 8px;
      border: 1px solid #243044;
      background: #0f1419;
      color: var(--text);
    }
    .debug-audio-btn {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 9px;
      border: 1px solid #4a6078;
      background: #243044;
      color: var(--text);
      cursor: pointer;
    }
    .debug-audio-btn:hover { background: #2d3f56; }
    .debug-audio-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .debug-audio-btn.active {
      background: #4a2518;
      border-color: #ffb020;
      color: #ffd699;
    }
    .debug-audio-status {
      min-height: 1.1rem;
      font-size: 0.7rem;
      color: var(--warn);
      line-height: 1.4;
    }
    .volume-bar {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px solid #24304488;
    }
    .volume-bar label {
      flex: 0 0 auto;
      font-size: 0.78rem;
      color: var(--muted);
      min-width: 4.2rem;
    }
    .volume-bar input[type="range"] {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      accent-color: var(--accent);
    }
    .volume-val {
      flex: 0 0 auto;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      min-width: 2.6rem;
      text-align: right;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(100%, 520px);
      max-height: 90vh;
      overflow: auto;
      background: var(--card);
      border: 1px solid #243044;
      border-radius: 16px;
      padding: 1rem 1.1rem 1.1rem;
    }
    .modal h2 {
      margin: 0 0 0.85rem;
      font-size: 1.15rem;
    }
    .field {
      margin-bottom: 0.85rem;
    }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .field select,
    .field input[type="range"] {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
    }
    .field select {
      padding: 0.45rem 0.55rem;
      border-radius: 10px;
      border: 1px solid #243044;
      background: #0f1419;
      color: var(--text);
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .range-val {
      min-width: 3.2rem;
      text-align: right;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .modal-note {
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0.2rem 0 0.85rem;
      line-height: 1.45;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }
    .btn-secondary,
    .btn-primary {
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.42rem 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #4a6078;
    }
    .btn-secondary {
      background: #243044;
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .settings-status {
      min-height: 1.1rem;
      font-size: 0.72rem;
      color: var(--warn);
      margin-top: 0.35rem;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0.55rem 1.1rem 0.75rem;
      overflow: hidden;
    }
    .top-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
      min-height: 0;
    }
    .state-big {
      flex: 0 0 auto;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent);
      white-space: nowrap;
    }
    .status-row {
      flex: 0 1 auto;
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      background: var(--card);
      font-size: 0.72rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.busy { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .cards {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      overflow: hidden;
    }
    .card {
      flex: 1 1 0;
      min-height: 0;
      background: var(--card);
      border-radius: 14px;
      padding: 0.65rem 0.85rem;
      border: 1px solid #243044;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card.user-card {
      flex: 0 0 auto;
      min-height: calc(1.05rem * 1.5 * 2 + 1.3rem);
    }
    .card.reply-card {
      flex: 1 1 auto;
      min-height: 0;
    }
    .card p {
      flex: 1 1 auto;
      margin: 0;
      line-height: 1.5;
      font-size: 1.05rem;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
    }
    .card.user-card p {
      -webkit-line-clamp: 2;
    }
    .card.reply-card p {
      font-size: 1.1rem;
      -webkit-line-clamp: 18;
    }
    .card p.hint {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      display: block;
      -webkit-line-clamp: unset;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>语音助手</h1>
      <div class="header-actions">
        <button id="debugBtn" class="debug-btn" type="button">调试</button>
        <button id="settingsBtn" class="settings-btn" type="button">设置</button>
        <button id="exitBtn" class="exit-btn" type="button">退出</button>
      </div>
    </div>
    <div class="volume-bar">
      <label for="speakerVolMain">喇叭音量</label>
      <input id="speakerVolMain" type="range" min="0" max="100" step="1" />
      <span id="speakerVolMainVal" class="volume-val">100%</span>
    </div>
  </header>
  <div id="settingsModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">语音设置</h2>
      <p class="modal-note">输出设备随输入配置自动切换。对话进行中无法更换音频设备。</p>
      <div class="field">
        <label for="audioProfile">输入设备</label>
        <select id="audioProfile"></select>
      </div>
      <div class="field">
        <label for="voiceId">音色</label>
        <select id="voiceId"></select>
      </div>
      <div class="field">
        <label for="speed">语速</label>
        <div class="range-row">
          <input id="speed" type="range" min="0.7" max="1.4" step="0.05" />
          <span id="speedVal" class="range-val">1.0</span>
        </div>
      </div>
      <div class="field" id="usbVolField">
        <label for="usbMicVol">USB 麦克风增益</label>
        <div class="range-row">
          <input id="usbMicVol" type="range" min="8000" max="24660" step="500" />
          <span id="usbMicVolVal" class="range-val">20000</span>
        </div>
      </div>
      <div class="field">
        <label for="speakerVol">喇叭音量</label>
        <div class="range-row">
          <input id="speakerVol" type="range" min="0" max="100" step="1" />
          <span id="speakerVolVal" class="range-val">100%</span>
        </div>
      </div>
      <div class="field">
        <label for="vadThreshold">VAD 灵敏度（越高越不敏感）</label>
        <div class="range-row">
          <input id="vadThreshold" type="range" min="0.35" max="0.75" step="0.01" />
          <span id="vadThresholdVal" class="range-val">0.58</span>
        </div>
      </div>
      <div class="field">
        <label for="vadSilence">句尾静音时长（秒）</label>
        <div class="range-row">
          <input id="vadSilence" type="range" min="0.35" max="1.0" step="0.01" />
          <span id="vadSilenceVal" class="range-val">0.68</span>
        </div>
      </div>
      <div class="field">
        <label for="vadTail">句尾补录（毫秒）</label>
        <div class="range-row">
          <input id="vadTail" type="range" min="0" max="600" step="25" />
          <span id="vadTailVal" class="range-val">350</span>
        </div>
      </div>
      <div id="settingsStatus" class="settings-status"></div>
      <div class="modal-actions">
        <button id="settingsCancel" class="btn-secondary" type="button">取消</button>
        <button id="settingsSave" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>
  <div id="debugModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal debug-modal" role="dialog" aria-labelledby="debugTitle">
      <div class="debug-toolbar">
        <h2 id="debugTitle">开发者调试</h2>
        <div class="debug-badges" id="debugBadges"></div>
      </div>
      <p class="modal-note">Orchestrator / 音频 / ASR / TTS / LLM / 进程 / 系统 / 日志尾部。仅供开发排查。</p>
      <div class="debug-audio-panel">
        <h3>音频调试（绕过 ASR/TTS）</h3>
        <p class="debug-audio-note">录音/回放/直通会暂时暂停语音助手聆听，完成后自动恢复。</p>
        <div class="debug-audio-row">
          <label>时长(秒)<input id="debugRecSec" type="number" min="1" max="30" value="5" /></label>
          <button id="debugRecBtn" class="debug-audio-btn" type="button">录音</button>
          <button id="debugPlayBtn" class="debug-audio-btn" type="button">回放</button>
          <button id="debugPassBtn" class="debug-audio-btn" type="button">直通对话</button>
        </div>
        <div id="debugAudioStatus" class="debug-audio-status"></div>
      </div>
      <div id="debugStatus" class="debug-status">点击「刷新」获取最新信息。</div>
      <pre id="debugBody" class="debug-pre">（尚未加载）</pre>
      <div class="modal-actions">
        <button id="debugCopy" class="btn-secondary" type="button">复制</button>
        <button id="debugRefresh" class="btn-secondary" type="button">刷新</button>
        <button id="debugClose" class="btn-primary" type="button">关闭</button>
      </div>
    </div>
  </div>
  <main>
    <div class="top-bar">
      <div id="state" class="state-big">—</div>
      <div class="status-row">
        <span class="pill"><span id="wsDot" class="dot"></span><span id="wsLabel">连接中…</span></span>
        <span class="pill"><span id="svcDot" class="dot"></span><span id="svcLabel">服务检测中…</span></span>
      </div>
    </div>
    <div class="cards">
      <div class="card user-card">
        <p id="asr" class="hint">等待语音输入</p>
      </div>
      <div class="card reply-card">
        <p id="reply" class="hint">等待回复</p>
      </div>
    </div>
  </main>
  <script>
    const WS_HOST = location.hostname || "127.0.0.1";
    const WS_URL = `ws://${WS_HOST}:8765/ws`;
    const stateEl = document.getElementById("state");
    const asrEl = document.getElementById("asr");
    const replyEl = document.getElementById("reply");
    const wsDot = document.getElementById("wsDot");
    const wsLabel = document.getElementById("wsLabel");
    const svcDot = document.getElementById("svcDot");
    const svcLabel = document.getElementById("svcLabel");
    const settingsBtn = document.getElementById("settingsBtn");
    const debugBtn = document.getElementById("debugBtn");
    const debugModal = document.getElementById("debugModal");
    const debugBody = document.getElementById("debugBody");
    const debugStatus = document.getElementById("debugStatus");
    const debugBadges = document.getElementById("debugBadges");
    const debugRefresh = document.getElementById("debugRefresh");
    const debugClose = document.getElementById("debugClose");
    const debugCopy = document.getElementById("debugCopy");
    const debugRecSec = document.getElementById("debugRecSec");
    const debugRecBtn = document.getElementById("debugRecBtn");
    const debugPlayBtn = document.getElementById("debugPlayBtn");
    const debugPassBtn = document.getElementById("debugPassBtn");
    const debugAudioStatus = document.getElementById("debugAudioStatus");
    const settingsModal = document.getElementById("settingsModal");
    const settingsCancel = document.getElementById("settingsCancel");
    const settingsSave = document.getElementById("settingsSave");
    const settingsStatus = document.getElementById("settingsStatus");
    const audioProfileEl = document.getElementById("audioProfile");
    const voiceIdEl = document.getElementById("voiceId");
    const speedEl = document.getElementById("speed");
    const speedValEl = document.getElementById("speedVal");
    const usbVolField = document.getElementById("usbVolField");
    const usbMicVolEl = document.getElementById("usbMicVol");
    const usbMicVolValEl = document.getElementById("usbMicVolVal");
    const speakerVolMainEl = document.getElementById("speakerVolMain");
    const speakerVolMainValEl = document.getElementById("speakerVolMainVal");
    const speakerVolEl = document.getElementById("speakerVol");
    const speakerVolValEl = document.getElementById("speakerVolVal");
    const vadThresholdEl = document.getElementById("vadThreshold");
    const vadThresholdValEl = document.getElementById("vadThresholdVal");
    const vadSilenceEl = document.getElementById("vadSilence");
    const vadSilenceValEl = document.getElementById("vadSilenceVal");
    const vadTailEl = document.getElementById("vadTail");
    const vadTailValEl = document.getElementById("vadTailVal");

    let wsRef = null;
    let settingsDraft = null;
    let speakerSaveTimer = null;
    let speakerSyncLock = false;
    let debugAudioBusy = false;
    let debugPassthrough = false;

    const STATE_ZH = {
      IDLE: "空闲",
      LISTEN: "聆听中",
      ASR: "识别中",
      LLM: "思考中",
      TTS: "播放中",
    };

    let llmBuf = "";

    function setContent(el, text, isHint) {
      el.textContent = text;
      el.classList.toggle("hint", !!isHint);
    }

    function setWs(on, text) {
      wsDot.className = "dot" + (on ? " on" : "");
      wsLabel.textContent = text;
    }

    function setSvc(on, text) {
      svcDot.className = "dot" + (on ? " on" : on === "busy" ? " busy" : "");
      if (on === "busy") svcDot.className = "dot busy";
      svcLabel.textContent = text;
    }

    document.getElementById("exitBtn").addEventListener("click", () => {
      window.close();
      setTimeout(() => { window.location.href = "about:blank"; }, 150);
    });

    function bindRange(input, label, fmt = (v) => v) {
      input.addEventListener("input", () => {
        label.textContent = fmt(input.value);
      });
    }
    bindRange(speedEl, speedValEl, (v) => Number(v).toFixed(2));
    bindRange(usbMicVolEl, usbMicVolValEl);
    bindRange(vadThresholdEl, vadThresholdValEl, (v) => Number(v).toFixed(2));
    bindRange(vadSilenceEl, vadSilenceValEl, (v) => Number(v).toFixed(2));
    bindRange(vadTailEl, vadTailValEl);
    bindRange(speakerVolMainEl, speakerVolMainValEl, (v) => `${Number(v)}%`);
    bindRange(speakerVolEl, speakerVolValEl, (v) => `${Number(v)}%`);

    function setSpeakerVolumeUi(value) {
      const v = Number(value);
      speakerSyncLock = true;
      speakerVolMainEl.value = v;
      speakerVolMainValEl.textContent = `${v}%`;
      speakerVolEl.value = v;
      speakerVolValEl.textContent = `${v}%`;
      speakerSyncLock = false;
    }

    function queueSpeakerVolumeSave(value) {
      if (speakerSaveTimer) clearTimeout(speakerSaveTimer);
      speakerSaveTimer = setTimeout(() => {
        if (!wsRef || wsRef.readyState !== WebSocket.OPEN) return;
        wsRef.send(JSON.stringify({
          type: "settings_set",
          patch: { speaker_volume: Number(value) },
        }));
      }, 350);
    }

    function onSpeakerVolumeInput(value) {
      if (speakerSyncLock) return;
      setSpeakerVolumeUi(value);
      queueSpeakerVolumeSave(value);
    }

    speakerVolMainEl.addEventListener("input", (ev) => onSpeakerVolumeInput(ev.target.value));
    speakerVolEl.addEventListener("input", (ev) => onSpeakerVolumeInput(ev.target.value));

    function openSettings() {
      settingsStatus.textContent = "";
      settingsModal.classList.add("open");
      settingsModal.setAttribute("aria-hidden", "false");
      if (wsRef && wsRef.readyState === WebSocket.OPEN) {
        wsRef.send(JSON.stringify({ type: "settings_get" }));
      }
    }

    function closeSettings() {
      settingsModal.classList.remove("open");
      settingsModal.setAttribute("aria-hidden", "true");
    }

    function setDebugAudioUi() {
      debugRecBtn.disabled = debugAudioBusy || debugPassthrough;
      debugPlayBtn.disabled = debugAudioBusy || debugPassthrough;
      debugPassBtn.disabled = debugAudioBusy;
      debugPassBtn.textContent = debugPassthrough ? "停止直通" : "直通对话";
      debugPassBtn.classList.toggle("active", debugPassthrough);
    }

    function sendDebugAudio(action, extra = {}) {
      if (!wsRef || wsRef.readyState !== WebSocket.OPEN) {
        debugAudioStatus.textContent = "未连接语音服务。";
        return;
      }
      debugAudioBusy = action === "record";
      setDebugAudioUi();
      debugAudioStatus.textContent = action === "record"
        ? `录音中（${extra.seconds || 5}s）…`
        : action === "play"
          ? "回放中…"
          : action === "passthrough_start"
            ? "正在开启直通…"
            : action === "passthrough_stop"
              ? "正在停止直通…"
              : "处理中…";
      wsRef.send(JSON.stringify({ type: "debug_audio", action, ...extra }));
    }

    function applyDebugAudioResult(msg) {
      debugAudioBusy = false;
      debugPassthrough = !!msg.passthrough;
      setDebugAudioUi();
      if (msg.message) {
        debugAudioStatus.textContent = msg.message;
      } else if (!msg.ok) {
        debugAudioStatus.textContent = msg.error || "操作失败";
      }
      if (msg.analysis && msg.analysis.lines) {
        debugAudioStatus.textContent += " · " + (msg.analysis.verdict || msg.analysis.summary || "");
      }
    }

    function openDebug() {
      debugModal.classList.add("open");
      debugModal.setAttribute("aria-hidden", "false");
      refreshDebug();
    }

    function closeDebug() {
      debugModal.classList.remove("open");
      debugModal.setAttribute("aria-hidden", "true");
    }

    function renderDebugBadges(snap) {
      debugBadges.innerHTML = "";
      const add = (label, ok) => {
        const el = document.createElement("span");
        el.className = "debug-badge " + (ok ? "ok" : "bad");
        el.textContent = label;
        debugBadges.appendChild(el);
      };
      const agent = snap.agent || {};
      const proc = snap.processes || {};
      const llm = snap.llm || {};
      add(`状态 ${agent.state || "?"}`, agent.state === "LISTEN" || agent.state === "IDLE");
      add(`arecord ${proc.arecord ? "OK" : "OFF"}`, !!proc.arecord);
      add(`LLM ${llm.ping_ok ? "OK" : "FAIL"}`, !!llm.ping_ok);
      add(`orch ${proc.orchestrator ? "OK" : "OFF"}`, !!proc.orchestrator);
    }

    function fillDebugSnapshot(snap) {
      debugBody.textContent = snap.text || "（无文本输出）";
      debugStatus.textContent = `更新时间：${snap.generated_at || "未知"}`;
      renderDebugBadges(snap);
      if (snap.debug_audio) {
        debugPassthrough = !!snap.debug_audio.passthrough;
        setDebugAudioUi();
      }
    }

    function refreshDebug() {
      if (!wsRef || wsRef.readyState !== WebSocket.OPEN) {
        debugStatus.textContent = "未连接语音服务，无法获取调试信息。";
        return;
      }
      debugStatus.textContent = "加载中…";
      wsRef.send(JSON.stringify({ type: "debug_get" }));
    }

    function fillSettings(snap) {
      settingsDraft = snap;
      audioProfileEl.innerHTML = "";
      (snap.audio_profiles || []).forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label;
        audioProfileEl.appendChild(opt);
      });
      audioProfileEl.value = snap.audio_profile || "auto";
      audioProfileEl.disabled = snap.can_change_audio === false;

      voiceIdEl.innerHTML = "";
      (snap.voices || []).forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v.id;
        opt.textContent = v.available ? v.label : `${v.label}（未安装）`;
        opt.disabled = !v.available;
        voiceIdEl.appendChild(opt);
      });
      voiceIdEl.value = snap.voice_id || "baker";

      speedEl.min = snap.speed_min || 0.7;
      speedEl.max = snap.speed_max || 1.4;
      speedEl.value = snap.speed || 1.0;
      speedValEl.textContent = Number(speedEl.value).toFixed(2);

      const showUsb = snap.usb_mic_supported || snap.active_audio_profile === "fy_sp701";
      usbVolField.style.display = showUsb ? "block" : "none";
      usbMicVolEl.max = snap.usb_mic_volume_max || 24660;
      usbMicVolEl.value = snap.usb_mic_volume || 20000;
      usbMicVolValEl.textContent = usbMicVolEl.value;

      const speakerVol = snap.speaker_volume ?? 100;
      setSpeakerVolumeUi(speakerVol);

      const vad = snap.vad || {};
      vadThresholdEl.value = vad.threshold ?? 0.58;
      vadThresholdValEl.textContent = Number(vadThresholdEl.value).toFixed(2);
      vadSilenceEl.value = vad.min_silence_duration ?? 0.68;
      vadSilenceValEl.textContent = Number(vadSilenceEl.value).toFixed(2);
      vadTailEl.value = vad.speech_tail_pad_ms ?? 350;
      vadTailValEl.textContent = vadTailEl.value;
    }

    function collectPatch() {
      return {
        audio_profile: audioProfileEl.value,
        voice_id: voiceIdEl.value,
        speed: Number(speedEl.value),
        usb_mic_volume: Number(usbMicVolEl.value),
        speaker_volume: Number(speakerVolEl.value),
        vad: {
          threshold: Number(vadThresholdEl.value),
          min_silence_duration: Number(vadSilenceEl.value),
          speech_tail_pad_ms: Number(vadTailEl.value),
        },
      };
    }

    settingsBtn.addEventListener("click", openSettings);
    debugBtn.addEventListener("click", openDebug);
    settingsCancel.addEventListener("click", closeSettings);
    debugClose.addEventListener("click", closeDebug);
    debugRefresh.addEventListener("click", refreshDebug);
    debugCopy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(debugBody.textContent || "");
        debugStatus.textContent = "已复制到剪贴板。";
      } catch {
        debugStatus.textContent = "复制失败，请手动选择文本。";
      }
    });
    debugRecBtn.addEventListener("click", () => {
      const seconds = Math.max(1, Math.min(30, Number(debugRecSec.value) || 5));
      debugRecSec.value = String(seconds);
      sendDebugAudio("record", { seconds });
    });
    debugPlayBtn.addEventListener("click", () => sendDebugAudio("play"));
    debugPassBtn.addEventListener("click", () => {
      sendDebugAudio(debugPassthrough ? "passthrough_stop" : "passthrough_start");
    });
    setDebugAudioUi();
    settingsModal.addEventListener("click", (ev) => {
      if (ev.target === settingsModal) closeSettings();
    });
    debugModal.addEventListener("click", (ev) => {
      if (ev.target === debugModal) closeDebug();
    });
    settingsSave.addEventListener("click", () => {
      if (!wsRef || wsRef.readyState !== WebSocket.OPEN) {
        settingsStatus.textContent = "未连接语音服务，无法保存。";
        return;
      }
      settingsStatus.textContent = "保存中…";
      wsRef.send(JSON.stringify({ type: "settings_set", patch: collectPatch() }));
    });

    function connect() {
      const ws = new WebSocket(WS_URL);
      wsRef = ws;
      ws.onopen = () => {
        setWs(true, "已连接");
        setSvc(true, "语音服务正常");
        ws.send(JSON.stringify({ type: "settings_get" }));
      };
      ws.onclose = () => {
        setWs(false, "未连接");
        setSvc(false, "服务离线 · 5 秒后重试");
        setTimeout(connect, 5000);
      };
      ws.onerror = () => setWs(false, "连接错误");
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "state" && msg.value) {
          stateEl.textContent = STATE_ZH[msg.value] || msg.value;
          setSvc(msg.value !== "IDLE" ? "busy" : true, msg.value === "IDLE" ? "语音服务正常" : "对话进行中");
        }
        if (msg.type === "asr_final" && msg.text) {
          setContent(asrEl, msg.text, false);
          llmBuf = "";
          setContent(replyEl, "…", false);
        }
        if (msg.type === "asr_partial" && msg.text) setContent(asrEl, msg.text + " …", false);
        if (msg.type === "llm_token" && msg.text) {
          llmBuf += msg.text;
          setContent(replyEl, llmBuf, false);
        }
        if (msg.type === "reply_final" && msg.text) {
          llmBuf = msg.text;
          setContent(replyEl, msg.text, false);
        }
        if (msg.type === "settings_snapshot") {
          fillSettings(msg);
          if (msg.state) {
            stateEl.textContent = STATE_ZH[msg.state] || msg.state;
          }
        }
        if (msg.type === "settings_applied") {
          if (msg.ok) {
            settingsStatus.textContent = msg.restart_vad
              ? "已保存，音频参数已热更新。"
              : "已保存。";
            fillSettings(msg);
            setTimeout(closeSettings, 700);
          } else if ((msg.errors || []).includes("busy")) {
            settingsStatus.textContent = "对话进行中，请稍后再切换音频设备。";
            fillSettings(msg);
          } else {
            settingsStatus.textContent = "保存失败，请重试。";
          }
        }
        if (msg.type === "voice_settings") {
          if (settingsModal.classList.contains("open") && wsRef) {
            wsRef.send(JSON.stringify({ type: "settings_get" }));
          }
        }
        if (msg.type === "debug_snapshot") {
          fillDebugSnapshot(msg);
        }
        if (msg.type === "debug_audio_result") {
          applyDebugAudioResult(msg);
        }
      };
    }
    connect();
  </script>
</body>
</html>
